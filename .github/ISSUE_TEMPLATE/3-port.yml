# Filing through the API or `gh issue create`? Forms only apply on the web:
# write the body with each field's label below as a `### ` heading, in order.
name: New port
description: Ask for mistpine in another app, or announce a port you are writing.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Writing one? Follow the [guidelines for ports](https://github.com/mistpine/mistpine/blob/main/docs/spec.md#guidelines-for-ports),
        read colors from `palette/mistpine.json` and name the repository
        `mistpine.<app>`. Until a port exists,
        [themes.utimura.io](https://themes.utimura.io) can export configs for
        several apps.
  - type: input
    id: app
    attributes:
      label: App
      placeholder: "WezTerm, VS Code, tmux, Zed"
    validations:
      required: true
  - type: input
    id: format
    attributes:
      label: Theme format
      description: A link to the app's docs on themes or color config.
  - type: dropdown
    id: who
    attributes:
      label: Who would write it?
      options:
        - I'm writing it
        - I'd like someone to
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repository
      description: If the port already exists somewhere.
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: What the app can style (syntax, UI, terminal colors), limits such as no italics or no transparency, and anything the spec doesn't cover.
  - type: dropdown
    id: author
    attributes:
      label: Who wrote this issue?
      description: Issues from agents are welcome; say so, so they can be read with that in mind.
      options:
        - A person
        - An AI agent, reviewed by a person
        - An AI agent, without human review
    validations:
      required: true
